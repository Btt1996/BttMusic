name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Archive (unsigned, iOS device arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore binary assets (pushed as base64)
        run: |
          find . -name '*.png.b64' | while read -r f; do
            out="${f%.b64}"
            base64 -d < "$f" > "$out.tmp" && mv "$out.tmp" "$out" && rm "$f"
          done
          file ios-btt-music/BttMusic/Assets.xcassets/AppIcon.appiconset/icon.png | grep -q 'PNG image data'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "iOS device SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Build unsigned device IPA
        run: |
          chmod +x scripts/make-unsigned-ipa.sh
          ./scripts/make-unsigned-ipa.sh

      # Belt and braces: re-verify the artifact independently of the script.
      - name: Verify device binary (arm64, iOS-device platform, not simulator)
        run: |
          APP=build/BttMusic.xcarchive/Products/Applications/BttMusic.app
          lipo -info "$APP/BttMusic" | tee /dev/stderr | grep -q arm64
          # Mach-O platform codes: 2 = iOS device, 7 = iossimulator
          vtool -show-build "$APP/BttMusic" | tee /dev/stderr | grep -qE '^ *platform (IOS|2)$'
          ! vtool -show-build "$APP/BttMusic" | grep -qE '^ *platform (IOSSIMULATOR|7)$'
          
      - name: Verify bundle ID and embedded Share Extension
        run: |
          APP=build/BttMusic.xcarchive/Products/Applications/BttMusic.app
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist" | grep -qx com.ahmed.btmu
          test -d "$APP/PlugIns/ShareExtension.appex"
          plutil -extract CFBundleIdentifier raw "$APP/PlugIns/ShareExtension.appex/Info.plist" | grep -qx com.ahmed.btmu.shareextension

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BttMusic-Unsigned
          path: build/BttMusic-Unsigned.ipa
          if-no-files-found: error
